---
- name: hp-dev
  policy: |
    {
      "Version": "2012-10-17",
      "Id": "AllowCloudFront",
      "Statement": [
          {
              "Sid": "AllowCloudFrontPrincipal",
              "Effect": "Allow",
              "Principal": {
                  "Service": "cloudfront.amazonaws.com"
              },
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::${workspace}-hp-dev/*",
              "Condition": {
                  "StringEquals": {
                      "AWS:SourceArn": "arn:aws:cloudfront::${account_id}:distribution/E2B46Z10ZSO418"
                  }
              }
          }
      ]
    }
- name: nobleworkfoundation
  policy: |
    {
      "Version": "2012-10-17",
      "Id": "AllowCloudFront",
      "Statement": [
          {
              "Sid": "AllowCloudFrontPrincipal",
              "Effect": "Allow",
              "Principal": {
                  "Service": "cloudfront.amazonaws.com"
              },
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::${workspace}-nobleworkfoundation/*",
              "Condition": {
                  "StringEquals": {
                      "AWS:SourceArn": "arn:aws:cloudfront::${account_id}:distribution/ELOLXQI0OGFQQ"
                  }
              }
          }
      ]
    }
