---
name: RELEASE

on:
  push:
    branches:
      - main
      - test
    paths:
      - tofu/*

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout
        
jobs:
  RELEASE:
    runs-on: ubuntu-slim

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6